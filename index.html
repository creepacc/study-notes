<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沉淀 · 个人知识库</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- 开场动画 -->
  <div id="intro" aria-hidden="true">
    <canvas id="intro-canvas"></canvas>
    <div class="intro-inner">
      <div class="intro-badge">Personal · Knowledge Base</div>
      <h1 class="intro-title" id="intro-title">沉淀</h1>
      <div class="intro-sub" id="intro-sub">记录 · 思考 · 成长</div>
      <div class="intro-progress"><div class="intro-progress-bar" id="intro-bar"></div></div>
      <div class="intro-count" id="intro-count">00</div>
    </div>
  </div>

  <!-- 主内容 -->
  <div id="main">
    <div class="app-shell">

      <!-- 全局左侧导航 -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <div class="brand-row">
            <span class="logo">◆ 沉淀</span>
            <div class="brand-actions">
              <span class="theme-toggle"></span>
              <button class="icon-btn" id="sidebar-hide" title="隐藏导航" aria-label="隐藏导航">⏴</button>
            </div>
          </div>
        </div>
        <nav class="col-nav" id="col-nav">
          <ul>
            <li class="col-item" data-view="resume">
              <div class="tree-row col"><span class="tree-label">简历</span></div>
            </li>
            <li class="col-item tree-folder" data-view="notes" id="col-notes">
              <div class="tree-row col"><span class="caret"></span><span class="tree-label">笔记</span></div>
              <ul class="tree-children" id="col-notes-tree"></ul>
            </li>
            <li class="col-item" data-view="apply">
              <div class="tree-row col"><span class="tree-label">秋招投递</span></div>
            </li>
            <li class="col-item" data-view="interview">
              <div class="tree-row col"><span class="tree-label">面试经验</span></div>
            </li>
          </ul>
        </nav>
      </aside>

      <button class="sidebar-float" id="sidebar-open" title="展开导航" aria-label="展开导航">☰</button>
      <div class="backdrop" id="backdrop"></div>

      <!-- 视图区 -->
      <main class="main">

        <!-- 简历 -->
        <section class="view" id="view-resume">
          <header class="view-head">
            <span class="view-title">简历</span>
            <a class="btn btn-sm" href="学习笔记/简历/王博_简历.pdf" download>
              <span>下载简历</span>
              <span class="btn-arrow">↓</span>
            </a>
          </header>
          <div class="resume-body">
            <img class="resume-img" src="学习笔记/简历/王博_简历.png" alt="王博简历" />
          </div>
        </section>

        <!-- 笔记 -->
        <section class="view" id="view-notes">
          <div class="note-viewer">
            <article class="note-content" id="note-content">
              <div class="loading">加载中…</div>
            </article>
          </div>
        </section>

        <!-- 秋招投递 -->
        <section class="view" id="view-apply">
          <header class="view-head">
            <span class="view-title">秋招投递</span>
            <div class="view-actions">
              <span class="apply-save-status" id="apply-save-status"></span>
              <button class="btn btn-sm btn-ghost" id="apply-save" type="button">保存到网页</button>
              <button class="btn btn-sm" id="apply-add" type="button">
                <span>添加</span>
                <span class="btn-arrow">＋</span>
              </button>
            </div>
          </header>
          <div class="apply-body">
            <div class="empty-view apply-empty" id="apply-empty">
              <p class="empty-sub">还没有投递记录,点右上角「添加」开始跟踪</p>
            </div>
            <ul class="apply-list" id="apply-list"></ul>
          </div>
        </section>

        <!-- 面试经验 -->
        <section class="view" id="view-interview">
          <div class="empty-view">
            <h1 class="empty-title">面试经验</h1>
            <p class="empty-sub">暂无</p>
          </div>
        </section>

      </main>
    </div>
  </div>

  <!-- 添加投递弹窗 -->
  <div class="modal" id="apply-modal" hidden>
    <div class="modal-card">
      <h2 class="modal-title">添加投递</h2>
      <form id="apply-form">
        <label class="modal-field">
          <span>公司名</span>
          <input id="apply-company" type="text" placeholder="例如:字节跳动" autocomplete="off">
        </label>
        <label class="modal-field">
          <span>招聘链接(选填)</span>
          <input id="apply-link" type="url" placeholder="https://careers.example.com" autocomplete="off">
        </label>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="apply-cancel">取消</button>
          <button type="submit" class="btn-submit">添加</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/theme.js"></script>
  <script src="assets/gate.js"></script>
  <script src="assets/marked.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
